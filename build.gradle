plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven {
        name = 'BlameJared Maven (CrT / Bookshelf)'
        url = 'https://maven.blamejared.com'
        content {
            includeGroup "foundry.veil"
            includeGroup "gg.moonflower"
            includeGroup "io.github.ocelot"
        }
    }
    maven {
        name = "Twelve Iterations Maven"
        url = "https://maven.twelveiterations.com/repository/maven-public"
        content {
            includeGroup "net.blay09.mods"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url = "https://maven.ithundxr.dev/snapshots"
        content {
            includeGroup "com.tterrag.registrate"
        }
    } // Registrate
    maven {
        url = "https://maven.createmod.net"
        content {
            includeGroup "com.simibubi.create"
            includeGroup "dev.engine-room.flywheel"
            includeGroup "net.createmod.ponder"
        }
    }
    maven {
        url = "https://maven.ryanhcode.dev/releases"
        content {
            includeGroup "dev.ryanhcode.sable"
            includeGroup "dev.ryanhcode.sable-companion"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        client2 {
            client()
            gameDirectory = project.file('run')
            programArguments.addAll '--username', 'SShakusora'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

def includeCreateRuntime = !providers.gradleProperty('waystonessable.noCreateRuntime')
        .map { it.toBoolean() }
        .orElse(false)
        .get()


dependencies {
    if (includeCreateRuntime) {
        implementation("com.simibubi.create:create-${minecraft_version}:6.0.10-280") {
            transitive = false
        }
    } else {
        compileOnly("com.simibubi.create:create-${minecraft_version}:6.0.10-280") {
            transitive = false
        }
    }
    implementation("net.blay09.mods:waystones-neoforge:21.1.39+1.21.1") {
        changing = true
    }
    if (includeCreateRuntime) {
        implementation("maven.modrinth:create-aeronautics:1.3.0+mc1.21.1") {
            transitive = false
        }
    } else {
        compileOnly("maven.modrinth:create-aeronautics:1.3.0+mc1.21.1") {
            transitive = false
        }
    }
    implementation ("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") {
        exclude group: "foundry.veil"
        if (!includeCreateRuntime) {
            exclude group: "com.simibubi.create"
            exclude group: "net.createmod.ponder"
            exclude group: "dev.engine-room.flywheel"
            exclude group: "com.tterrag.registrate"
        }
    }
    implementation("foundry.veil:veil-common-${project.minecraft_version}:${project.veil_version}") {
        exclude group: "maven.modrinth"
    }

    compileOnly("dev.ryanhcode.sable-companion:sable-companion-common-${project.minecraft_version}:${project.sable_companion_version}")
    compileOnly "net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1"
    compileOnly "com.tterrag.registrate:Registrate:MC1.21-1.3.0+67"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6"
    compileOnly "net.blay09.mods:balm-neoforge:21.0.59+1.21.1"
    runtimeOnly "net.blay09.mods:balm-neoforge:21.0.59+1.21.1"
//    runtimeOnly "curse.maven:xaeros-world-map-317780:8449921"
//    runtimeOnly "curse.maven:xaeros-minimap-263420:8449819"
    // Example mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${mc_version}-forge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
tasks.register('publishSnapshot') {
    group = 'publishing'
    description = 'Publish SNAPSHOT with a fixed (non-timestamped) filename, overwriting the previous snapshot.'
    dependsOn 'jar', 'sourcesJar', 'generatePomFileForMavenJavaPublication'

    doLast {
        def nexusUrl = (project.findProperty('nexusUrl') ?: 'https://maven.sshakusora.com/repository/waystones-sable').toString()
        def user = project.findProperty('nexusUsername') ?: 'sshakusora'
        def pass = project.findProperty('nexusPassword') ?: ''
        def groupPath = project.group.replace('.', '/')
        def mavenVersion = "${minecraft_version}-${project.version}"
        def fileName = "${mod_id}-${mavenVersion}"
        def baseDir = "${nexusUrl}/${groupPath}/${mod_id}/${mavenVersion}"
        def auth = java.util.Base64.getEncoder().encodeToString("${user}:${pass}".getBytes('UTF-8'))

        def upload = { File f, String name ->
            def conn = (HttpURLConnection) new URL("${baseDir}/${name}").openConnection()
            conn.requestMethod = 'PUT'
            conn.doOutput = true
            conn.setRequestProperty('Authorization', "Basic ${auth}")
            conn.setRequestProperty('Content-Type', name.endsWith('.pom') ? 'application/xml' : 'application/java-archive')
            f.withInputStream { conn.outputStream.withStream { out -> out << it } }
            def code = conn.responseCode
            if (code >= 300) throw new GradleException("Upload failed (${code}) for ${name}")
            println "Uploaded ${name} (${code})"
        }

        upload(tasks.named('jar').get().archiveFile.get().asFile, "${fileName}.jar")
        upload(tasks.named('sourcesJar').get().archiveFile.get().asFile, "${fileName}-sources.jar")
        upload(layout.buildDirectory.file('publications/mavenJava/pom-default.xml').get().asFile, "${fileName}.pom")
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            groupId = project.group
            artifactId = mod_id
            version = "${minecraft_version}-${project.version}"
        }
    }
    repositories {
        maven {
            name = 'Nexus'
            url = uri(project.findProperty('nexusUrl') ?: 'https://maven.sshakusora.com/repository/waystones-sable')
            credentials {
                username = project.findProperty('nexusUsername') ?: 'sshakusora'
                password = project.findProperty('nexusPassword') ?: ''
            }
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
